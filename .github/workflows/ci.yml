name: CI

on:
    pull_request:
        branches:
            - dev
            - main
    push:
        branches:
            - dev
            - main

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    security-and-build:
        name: Next.js CI
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup project
              uses: ./.github/actions/setup-pnpm

            - name: Security lint
              run: pnpm lint:security

            - name: Type check
              run: pnpm typecheck

            - name: Audit production dependencies
              run: pnpm audit:prod

            - name: Build
              run: pnpm build
              env:
                  NEXT_TELEMETRY_DISABLED: "1"
