version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    target-branch: "dev"
    groups:
      next-stack:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@next/*"
      lint-and-format:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "prettier"
      test-tools:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    target-branch: "dev"